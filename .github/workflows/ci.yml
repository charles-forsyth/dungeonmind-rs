name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check compilation
        run: cargo check --all-targets

      - name: Run simulation & learning tests
        run: cargo test --test sim
